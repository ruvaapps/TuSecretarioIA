name: Deploy Automático a DirectAdmin

on:
  push:
    branches:
      - main
      - desarrollo

jobs:
  deploy-desarrollo:
    if: github.ref == 'refs/heads/desarrollo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Subir a carpeta Desarrollo
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}

  deploy-produccion:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Subir a carpeta Public (Producción)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
