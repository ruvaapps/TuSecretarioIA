name: Deploy Automático

on:
  push:
    branches:
      - main
      - desarrollo  # Cambia esto por el nombre exacto de tu rama de desarrollo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar llave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy a Desarrollo (Rama desarrollo)
        if: github.ref == 'refs/heads/desarrollo'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /ruta/absoluta/a/tu/servidor/Desarrollo
            git pull origin desarrollo

      - name: Deploy a Producción (Rama main)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /ruta/absoluta/a/tu/servidor/Public
            git pull origin main
